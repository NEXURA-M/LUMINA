<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMINA — Start a Project</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .brand { font-family: 'Space Grotesk', sans-serif; }
    body { background: #050510; overflow-x: hidden; }
    .blob { position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.3; z-index: -1; animation: float 14s ease-in-out infinite; }
    .blob-1 { width: 550px; height: 550px; background: #7c3aed; top: -180px; right: -120px; }
    .blob-2 { width: 400px; height: 400px; background: #06b6d4; bottom: -100px; left: -100px; animation-delay: -5s; }
    .blob-3 { width: 300px; height: 300px; background: #f59e0b; top: 50%; left: 40%; animation-delay: -9s; opacity: 0.2; }
    @keyframes float { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px, 30px) scale(1.1); } }
    .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); }
    .gradient-text { background: linear-gradient(135deg, #a78bfa, #22d3ee, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .btn-primary { background: linear-gradient(135deg, #7c3aed, #06b6d4); transition: all 0.3s; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(124,58,237,0.5); }
    .type-card { transition: all 0.25s ease; cursor: pointer; }
    .type-card:hover { border-color: rgba(34,211,238,0.5); background: rgba(255,255,255,0.07); }
    .type-card.selected { border-color: #22d3ee; background: rgba(34,211,238,0.1); box-shadow: 0 0 0 1px #22d3ee; }
    .fade-in { animation: fadeIn 0.6s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #22d3ee; box-shadow: 0 0 0 3px rgba(34,211,238,0.15); }
    .mono { font-family: 'Space Grotesk', monospace; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-12 text-white">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="w-full max-w-2xl fade-in">
    <div class="text-center mb-10">
      <h1 class="text-5xl md:text-6xl font-bold brand gradient-text tracking-tight">LUMINA</h1>
      <p class="text-white/40 text-sm mt-2 tracking-[6px] uppercase">Created by Devil Developers</p>
    </div>

    <div class="glass rounded-3xl p-8 md:p-10 shadow-2xl">
      <h2 class="text-2xl font-semibold brand mb-1">Start Your Project</h2>
      <p class="text-white/40 text-sm mb-8">Tell us what you need. We'll reach out on WhatsApp.</p>

      <div id="form-area" class="space-y-6">
        <!-- WhatsApp -->
        <div>
          <label class="block text-xs text-white/50 uppercase tracking-widest mb-2">WhatsApp Number</label>
          <input id="whatsapp" type="tel" placeholder="+91 98765 43210" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder-white/20 transition" />
        </div>

        <!-- Type -->
        <div>
          <label class="block text-xs text-white/50 uppercase tracking-widest mb-3">What do you want to build?</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="type-grid">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-xs text-white/50 uppercase tracking-widest mb-2">Project Description <span class="text-white/20">(max 50 words)</span></label>
          <textarea id="description" rows="4" placeholder="Describe your vision..." class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/20 transition resize-none"></textarea>
          <p class="text-right text-xs text-white/30 mt-1"><span id="word-count">0</span> / 50 words</p>
        </div>

        <button onclick="handleSubmit()" class="btn-primary w-full py-3.5 rounded-xl font-semibold text-sm tracking-wide">Submit Inquiry →</button>
      </div>

      <!-- Success -->
      <div id="success-area" class="hidden text-center py-8">
        <div class="w-16 h-16 rounded-full bg-emerald-500/20 flex items-center justify-center mx-auto mb-4">
          <span class="text-3xl">✓</span>
        </div>
        <h3 class="text-xl font-semibold brand mb-2">Inquiry Received</h3>
        <p class="text-white/40 text-sm">We'll contact you on WhatsApp shortly.</p>
        <button onclick="resetForm()" class="mt-6 text-white/30 text-xs underline hover:text-white/60">Submit another</button>
      </div>

      <div id="error-area" class="hidden mt-4 text-red-400 text-sm text-center"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const REPO = CONFIG.repo;
    const TOKEN = CONFIG.token;

    const TYPES = [
      { id: 'web', label: 'Web', icon: '🌐', price: 'Custom Quote' },
      { id: 'ai-chatgpt', label: 'AI like ChatGPT', icon: '🤖', price: 'Custom Quote' },
      { id: 'ai-gemini', label: 'AI like Gemini Nano Banana', icon: '🍌', price: 'Custom Quote' },
      { id: 'app', label: 'App', icon: '📱', price: 'Custom Quote' },
      { id: 'game', label: 'Game', icon: '🎮', price: 'Custom Quote' },
      { id: 'web-builder', label: 'Web Builder Premium', icon: '🛠️', price: '₹1,000 – ₹2,500' },
      { id: 'ai-builder', label: 'AI Builder — Unique Project', icon: '✨', price: '₹7,000 – ₹50,000' },
    ];

    let selectedType = null;
    let isProcessing = false;

    // Render type cards
    const grid = document.getElementById('type-grid');
    TYPES.forEach(t => {
      const div = document.createElement('div');
      div.className = 'type-card glass rounded-xl p-4 flex items-start gap-3';
      div.dataset.id = t.id;
      div.innerHTML = `
        <span class="text-2xl">${t.icon}</span>
        <div>
          <p class="font-medium text-sm">${t.label}</p>
          <p class="text-white/40 text-xs mt-0.5">${t.price}</p>
        </div>
      `;
      div.onclick = () => selectType(t.id, div);
      grid.appendChild(div);
    });

    function selectType(id, el) {
      document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedType = id;
    }

    // Word counter
    const descEl = document.getElementById('description');
    descEl.addEventListener('input', () => {
      const words = descEl.value.trim().split(/\s+/).filter(w => w.length > 0);
      document.getElementById('word-count').textContent = words.length;
      if (words.length > 50) {
        descEl.value = words.slice(0, 50).join(' ');
        document.getElementById('word-count').textContent = 50;
      }
    });

    async function createIssue(title, body) {
      const res = await fetch(`https://api.github.com/repos/${REPO}/issues`, {
        method: 'POST',
        headers: {
          'Authorization': `token ${TOKEN}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ title, body })
      });
      if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
      return res.json();
    }

    async function handleSubmit() {
      if (isProcessing) return;
      const errorEl = document.getElementById('error-area');
      errorEl.classList.add('hidden');

      const whatsapp = document.getElementById('whatsapp').value.trim();
      const desc = descEl.value.trim();

      if (!whatsapp || !/^\+?[\d\s-]{7,15}$/.test(whatsapp)) {
        errorEl.textContent = 'Please enter a valid WhatsApp number.';
        errorEl.classList.remove('hidden');
        return;
      }
      if (!selectedType) {
        errorEl.textContent = 'Please select a project type.';
        errorEl.classList.remove('hidden');
        return;
      }
      const wordCount = desc.split(/\s+/).filter(w => w.length > 0).length;
      if (wordCount === 0) {
        errorEl.textContent = 'Please write a short description.';
        errorEl.classList.remove('hidden');
        return;
      }

      isProcessing = true;
      const btn = document.querySelector('#form-area button');
      btn.textContent = 'Submitting...';
      btn.disabled = true;

      try {
        const typeLabel = TYPES.find(t => t.id === selectedType)?.label || selectedType;
        const body = `### Project Inquiry\n- **WhatsApp:** ${whatsapp}\n- **Type:** ${typeLabel}\n- **Description:** ${desc}\n- **Timestamp:** ${new Date().toISOString()}`;
        await createIssue(`[WIN] ${whatsapp} — ${typeLabel}`, body);

        document.getElementById('form-area').classList.add('hidden');
        document.getElementById('success-area').classList.remove('hidden');
      } catch (e) {
        errorEl.textContent = 'Something went wrong. Please try again.';
        errorEl.classList.remove('hidden');
        console.error(e);
      } finally {
        isProcessing = false;
        btn.textContent = 'Submit Inquiry →';
        btn.disabled = false;
      }
    }

    function resetForm() {
      document.getElementById('success-area').classList.add('hidden');
      document.getElementById('form-area').classList.remove('hidden');
      document.getElementById('whatsapp').value = '';
      descEl.value = '';
      document.getElementById('word-count').textContent = '0';
      selectedType = null;
      document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
    }
  </script>
</body>
</html>
