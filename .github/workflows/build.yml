name: Sync Data from Issues

on:
  issues:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'   # Hourly backup sync

# Prevent overlapping runs (e.g. 2 users submit at once)
concurrency:
  group: lumina-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # to commit data.json / dw.json
      issues: read      # to read issues via GITHUB_TOKEN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install @octokit/rest

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/sync.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json dw.json
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "🤖 Auto-sync from issues [skip ci]"
            git push
            echo "✅ Pushed updated data.json & dw.json"
          fi
